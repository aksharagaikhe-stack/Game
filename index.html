
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Defender</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <header>
      <h1>🚀 SPACE DEFENDER</h1>
      <p class="subtitle">Protect the galaxy. Defeat the invaders.</p>
    </header>

    <section class="hud">
      <div class="stat">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="stat">
        <span>Lives</span>
        <strong id="lives">3</strong>
      </div>
      <div class="stat">
        <span>Best</span>
        <strong id="best">0</strong>
      </div>
    </section>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="500"></canvas>

      <div id="gameOverScreen" class="game-over hidden">
        <h2>GAME OVER</h2>
        <p>Your final score: <span id="finalScore">0</span></p>
        <button id="playAgainBtn">🔄 Play Again</button>
      </div>

      <div id="startScreen" class="start-screen">
        <h2>Ready, Pilot?</h2>
        <p>Defend your galaxy from enemy ships!</p>
        <button id="beginBtn">🚀 Start Game</button>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn">▶ Start</button>
      <button id="pauseBtn">⏸ Pause</button>
      <button id="restartBtn">🔄 Restart</button>
    </div>

    <div class="mobile-controls">
      <button id="leftBtn" aria-label="Move left">⬅️</button>
      <button id="shootBtn" aria-label="Shoot">🔥 SHOOT</button>
      <button id="rightBtn" aria-label="Move right">➡️</button>
    </div>

    <p class="instructions">
      <strong>Controls:</strong> ← → or A/D to move · SPACE to shoot · P to pause
    </p>

  </main>

  <script src="script.js"></script>
</body>
</html>
